name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code. Nothing here needs a secret or a database.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Lint
        run: npx eslint . --max-warnings 0
